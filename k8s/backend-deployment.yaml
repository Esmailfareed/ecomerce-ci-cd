
apiVersion : apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workshop
  labels:
     role: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      role: backend
  template:
    metadata:
      labels:
        role: backend
    spec:
      containers:
        - name: backend
          image: 928430095864.dkr.ecr.us-east-1.amazonaws.com/project-k8s:backend
          imagePullPolicy: Always         

          env:
           - name: DB_ONLINE
             value: "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/ecommerce?replicaSet=rs0"
          ports:
            - containerPort: 3000    

